name: Android accessibility verification

on:
  push:
    branches: [codex/compose-accessibility-20261025]
  pull_request:
    branches: [agent/antigravity-mornica-launch-contract-20261019]

permissions:
  contents: read

concurrency:
  group: android-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Record candidate identity
        run: |
          git rev-parse HEAD
          java -version
          chmod +x ./gradlew
      - name: Test, lint and build debug candidate
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
